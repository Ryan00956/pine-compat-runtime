[package]
name = "pine-runtime"
version = "0.1.0"
description.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false }
pine-builtins = { path = "../pine-builtins" }
pine-ir = { path = "../pine-ir" }
regex = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
pine-sema = { path = "../pine-sema" }
pine-syntax = { path = "../pine-syntax" }
serde_json = "1"

[lib]
name = "pine_runtime"
path = "src/lib.rs"
