name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python test tooling
        run: python -m pip install --upgrade pip maturin pytest
      - name: Build Python extension
        run: maturin build --manifest-path crates/pine-python/Cargo.toml --out dist
      - name: Install Python extension
        run: python -m pip install dist/*.whl
      - name: Python tests
        run: python -m pytest python/tests

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: WASM check
        run: cargo check -p pine-wasm --target wasm32-unknown-unknown
